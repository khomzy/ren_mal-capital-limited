<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    text-align: center;
    max-width: 550px;
  }

  .code {
    font-size: clamp(120px, 25vw, 200px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.05em;
    color: #1a1a1a;
    margin-bottom: 20px;
  }

  .title {
    font-size: clamp(20px, 4vw, 28px);
    font-weight: 600;
    margin-bottom: 16px;
    color: #1a1a1a;
  }

  .message {
    font-size: 16px;
    color: #666666;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1 class="title">Page Not Found</h1>
    <p class="message">This page is unavailable because the hosting service has frozen this website. Please contact the administrator or website owner for more details.</p>
  </div>
</body>
</html>
